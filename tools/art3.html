<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ball Vs Ball cover</title>
<style>
  @font-face { font-family: 'Anton'; src: url('../fonts/anton.woff2') format('woff2'); }
  @font-face { font-family: 'Noto Serif JP Black'; src: url('../fonts/noto-serif-jp-900-sub.woff2') format('woff2'); font-weight: 900; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../js/core.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/data.js"></script>
<script src="../js/data2.js"></script>
<script src="../js/abilities.js"></script>
<script src="../js/balance.js"></script>
<script src="../js/sim.js"></script>
<script src="../js/render.js"></script>
<script src="../js/art.js"></script>
<script src="../js/art2.js"></script>
<script src="../js/kami.js"></script>
<script src="../js/data3.js"></script>
<script src="../js/data4.js"></script>
<script src="../js/flair.js"></script>
<script>
// Key art: two heroes clashing mid-arena, a crowd of weapon and special balls charging in.
// art3.html?w=1920&h=1080  (also 800x1200 portrait, 800x800 square)
(async function () {
  const q = new URLSearchParams(location.search);
  const W = +q.get('w') || 1920, H = +q.get('h') || 1080;
  const cv = document.getElementById('c'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const TAU = Math.PI * 2, U = Math.min(W, H), port = H > W * 1.15, wide = W > H * 1.3;
  const rng = BB.RNG(77);
  await document.fonts.load('100px Anton');
  const cx = W * 0.5, cy = port ? H * 0.56 : H * 0.6;

  // ---------------------------------------------------------------- background
  // team-coloured split: electric blue on the left, hot orange-red on the right, a jagged
  // lightning seam through the clash
  const seam = []; { let x = cx + W * 0.04, y = -10; seam.push([x, y]); while (y < H + 10) { y += U * (0.04 + rng() * 0.05); x = cx + (y - cy) * -0.18 + (rng() - 0.5) * U * 0.07; seam.push([x, y]); } }
  const side = (left) => {
    ctx.save(); ctx.beginPath();
    if (left) { ctx.moveTo(-10, -10); for (const [x, y] of seam) ctx.lineTo(x, y); ctx.lineTo(-10, H + 10); }
    else { ctx.moveTo(W + 10, -10); for (const [x, y] of seam) ctx.lineTo(x, y); ctx.lineTo(W + 10, H + 10); }
    ctx.closePath(); ctx.clip();
    const gx = left ? W * 0.25 : W * 0.75, gr = ctx.createRadialGradient(gx, cy, 0, gx, cy, Math.hypot(W, H) * 0.6);
    if (left) { gr.addColorStop(0, '#5fd8ff'); gr.addColorStop(0.35, '#1f7cf0'); gr.addColorStop(0.75, '#0d2f8a'); gr.addColorStop(1, '#071645'); }
    else { gr.addColorStop(0, '#ffd34d'); gr.addColorStop(0.3, '#ff7a1f'); gr.addColorStop(0.7, '#d81e3a'); gr.addColorStop(1, '#5a0718'); }
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    // comic halftone dots, bigger towards the outer edge
    ctx.fillStyle = left ? 'rgba(255,255,255,0.10)' : 'rgba(255,240,200,0.12)';
    const step = U * 0.03;
    for (let y = 0; y < H; y += step) for (let x = (Math.round(y / step) % 2) * step / 2; x < W; x += step) {
      const k = Math.min(1, Math.abs(x - cx) / (W * 0.5)), r = step * 0.42 * k * k;
      if (r > 0.5) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
    }
    ctx.restore();
  };
  side(true); side(false);
  // god rays + speed lines out of the clash
  ctx.save(); ctx.translate(cx, cy); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 22; i++) {
    const a = (i / 22) * TAU + rng() * 0.12, w = 0.025 + rng() * 0.05, R = Math.hypot(W, H);
    const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
    gr.addColorStop(0, 'rgba(255,255,230,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, a, a + w); ctx.closePath(); ctx.fill();
  }
  for (let i = 0; i < 120; i++) {
    const a = rng() * TAU, r0 = U * (0.45 + rng() * 0.4), r1 = r0 + U * (0.15 + rng() * 0.5);
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.08 + rng() * 0.18) + ')'; ctx.lineWidth = U * (0.002 + rng() * 0.004);
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.stroke();
  }
  ctx.restore();
  // the lightning seam itself
  ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const [c, w] of [['rgba(255,255,255,0.35)', U * 0.03], ['#ffffff', U * 0.008]]) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); seam.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke(); }
  ctx.restore();
  // flying rock debris
  for (let i = 0; i < 18; i++) {
    const a = rng() * TAU, d = U * (0.18 + rng() * 0.3), x = cx + Math.cos(a) * d * 1.4, y = cy + Math.sin(a) * d, r = U * (0.006 + rng() * 0.014);
    ctx.save(); ctx.translate(x, y); ctx.rotate(rng() * TAU); ctx.beginPath();
    for (let k = 0; k < 6; k++) { const aa = (k / 6) * TAU, rr = r * (0.6 + rng() * 0.5); k ? ctx.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr) : ctx.moveTo(Math.cos(aa) * rr, Math.sin(aa) * rr); }
    ctx.closePath(); ctx.fillStyle = '#3a2a22'; ctx.fill(); ctx.lineWidth = U * 0.003; ctx.strokeStyle = '#0d0d12'; ctx.stroke(); ctx.restore();
  }

  // ---------------------------------------------------------------- the cast (real game art)
  const crowd = ['axe', 'trident', 'hammer', 'scythe', 'torch', 'icestaff', 'cannon', 'vampire', 'flail', 'bow', 'frost', 'mace']; // warm colours on the blue side, cool on the red
  const heroA = 'claymore', heroB = 'sword';
  const teams = [[{ id: heroA, hp: 100, slot: 0 }], [{ id: heroB, hp: 100, slot: 1 }], [], []];
  crowd.forEach((id, i) => teams[i % 4].push({ id, hp: 100, slot: i + 2 }));
  const sim = new BB.Sim({ seed: 3, map: 'classic', settings: { dmgNumbers: false, callouts: false }, teams });
  sim.preview = true; sim.t = 1.3; sim.nTeams = 2;
  for (const b of sim.balls) b.main = false;
  // skip the HP numbers (pure digits) when drawing balls
  const ft = ctx.fillText.bind(ctx), st = ctx.strokeText.bind(ctx);
  let quiet = false;
  ctx.fillText = (t, ...r) => { if (!(quiet && /^\d+$/.test(t))) ft(t, ...r); };
  ctx.strokeText = (t, ...r) => { if (!(quiet && /^\d+$/.test(t))) st(t, ...r); };
  const R0 = { dark: false };
  const ball = (id) => sim.balls.find((b) => b.def.id === id);
  function drawBall(b, x, y, rad, ang, alpha) {
    b.x = 0; b.y = 0; b.w.angle = ang; b.w.prevAngle = ang; if (sim.computeCaps) sim.computeCaps(b);
    const k = rad / b.r;
    ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.setTransform(k, 0, 0, k, x, y);
    quiet = true; BB.drawBallArt(ctx, sim, b, 3, R0); quiet = false; ctx.restore();
  }
  // the crowd charging in from the sides
  const SPOTS = port
    ? [[0.15, 0.36], [0.85, 0.37], [0.1, 0.62], [0.9, 0.64], [0.22, 0.86], [0.78, 0.87], [0.5, 0.93]]
    : wide
      ? [[0.08, 0.36], [0.92, 0.34], [0.06, 0.72], [0.94, 0.7], [0.22, 0.9], [0.78, 0.9], [0.5, 0.94]]
      : [[0.12, 0.38], [0.88, 0.38], [0.1, 0.74], [0.9, 0.75], [0.3, 0.91], [0.7, 0.91]];
  SPOTS.forEach(([fx, fy2], i) => {
    const b = ball(crowd[i % crowd.length]), x = fx * W, y = fy2 * H;
    const rad = U * (0.055 + rng() * 0.025), inA = Math.atan2(cy - y, cx - x);
    for (let t = 3; t >= 1; t--) drawBall(b, x - Math.cos(inA) * rad * 0.9 * t, y - Math.sin(inA) * rad * 0.9 * t, rad, inA + 0.4 - t * 0.35, 0.12 * (4 - t));
    drawBall(b, x, y, rad, inA + 0.4);
  });
  // the two heroes clash in the middle: big balls, weapons crossing over a white-hot spark
  const HR = U * (port ? 0.13 : 0.12), off = HR * (port ? 2.0 : 2.3), tilt = 0.32;
  const A = ball(heroA), B = ball(heroB);
  for (let t = 3; t >= 1; t--) { drawBall(A, cx - off - HR * 0.7 * t, cy + HR * 0.15 * t, HR, -tilt - 0.2 * t, 0.1 * (4 - t)); drawBall(B, cx + off + HR * 0.7 * t, cy + HR * 0.15 * t, HR, Math.PI + tilt + 0.2 * t, 0.1 * (4 - t)); }
  drawBall(A, cx - off, cy, HR, -tilt);
  drawBall(B, cx + off, cy, HR, Math.PI + tilt);
  const sx = cx, sy = cy - off * Math.tan(tilt); // where the blades cross
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const sp = ctx.createRadialGradient(sx, sy, 0, sx, sy, HR * 0.9); sp.addColorStop(0, 'rgba(255,255,255,1)'); sp.addColorStop(0.25, 'rgba(255,230,150,0.8)'); sp.addColorStop(1, 'rgba(255,120,40,0)');
  ctx.fillStyle = sp; ctx.beginPath(); ctx.arc(sx, sy, HR * 0.9, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,250,220,0.95)'; ctx.lineCap = 'round';
  for (let i = 0; i < 26; i++) { const a = rng() * TAU, r0 = HR * (0.15 + rng() * 0.2), r1 = r0 + HR * (0.3 + rng() * 0.7); ctx.lineWidth = U * (0.003 + rng() * 0.004); ctx.beginPath(); ctx.moveTo(sx + Math.cos(a) * r0, sy + Math.sin(a) * r0); ctx.lineTo(sx + Math.cos(a) * r1, sy + Math.sin(a) * r1); ctx.stroke(); }
  for (const [r, al] of [[0.7, 0.6], [1.2, 0.35]]) { ctx.beginPath(); ctx.arc(sx, sy, HR * r, 0, TAU); ctx.strokeStyle = 'rgba(255,220,120,' + al + ')'; ctx.lineWidth = U * 0.008; ctx.stroke(); }
  ctx.restore();
  // embers
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 160; i++) { const x = rng() * W, y = rng() * H, r = U * (0.001 + rng() * 0.004); ctx.fillStyle = rng() < 0.7 ? 'rgba(255,170,90,0.8)' : 'rgba(255,240,190,0.9)'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  ctx.restore();
  const vg = ctx.createRadialGradient(W / 2, H / 2, U * 0.4, W / 2, H / 2, Math.hypot(W, H) * 0.62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.45)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  // ---------------------------------------------------------------- title
  function title(cx, cy, size) {
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = size + 'px Anton';
    const parts = [['BALL', '#ffffff', '#c9d1db'], ['VS', null], ['BALL', '#ffe066', '#ffaa00']];
    const gap = size * 0.16, vsW = size * 0.62;
    const bw = ctx.measureText('BALL').width, total = bw * 2 + vsW + gap * 2;
    let x = cx - total / 2;
    for (const [t, c1, c2] of parts) {
      if (!c1) {
        const s = size * 0.5; ctx.save(); ctx.translate(x + vsW / 2, cy + size * 0.02); ctx.rotate(-0.14);
        ctx.fillStyle = '#000'; ctx.fillRect(-vsW / 2 - 6, -s * 0.62 + 8, vsW + 12, s * 1.24);
        ctx.fillStyle = '#e8103a'; ctx.fillRect(-vsW / 2, -s * 0.62, vsW, s * 1.24);
        ctx.lineWidth = size * 0.04; ctx.strokeStyle = '#000'; ctx.strokeRect(-vsW / 2, -s * 0.62, vsW, s * 1.24);
        ctx.font = s + 'px Anton'; ctx.fillStyle = '#fff'; ctx.fillText('VS', 0, s * 0.04); ctx.restore();
        x += vsW + gap; continue;
      }
      const cxp = x + bw / 2;
      ctx.lineJoin = 'round';
      ctx.fillStyle = '#000'; ctx.fillText(t, cxp, cy + size * 0.07);
      ctx.lineWidth = size * 0.11; ctx.strokeStyle = '#000'; ctx.strokeText(t, cxp, cy);
      const tg = ctx.createLinearGradient(0, cy - size / 2, 0, cy + size / 2); tg.addColorStop(0, c1); tg.addColorStop(1, c2);
      ctx.fillStyle = tg; ctx.fillText(t, cxp, cy);
      x += bw + gap;
    }
    ctx.restore();
  }
  const ts = port ? W * 0.2 : wide ? H * 0.17 : W * 0.17;
  title(W / 2, port ? H * 0.14 : H * 0.15, Math.round(ts));
  window.ARTDONE = true;
})();
</script>
</body>
</html>
