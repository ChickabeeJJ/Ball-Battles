<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ball Battles cover art</title>
<style>
  @font-face { font-family: 'Anton'; src: url('../fonts/anton.woff2') format('woff2'); }
  @font-face { font-family: 'Lilita One'; src: url('../fonts/lilita-one.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../js/core.js"></script>
<script src="../js/data.js"></script>
<script src="../js/data2.js"></script>
<script src="../js/render.js"></script>
<script src="../js/art.js"></script>
<script src="../js/art2.js"></script>
<script>
// Cinematic store covers. art.html?w=1920&h=1080 — only the title appears as text.
(function () {
  const q = new URLSearchParams(location.search);
  const W = +q.get('w') || 1920, H = +q.get('h') || 1080;
  const cv = document.getElementById('c');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const TAU = Math.PI * 2, OUT = '#0d0d12';
  const U = Math.min(W, H);
  const rng = BB.RNG(2024);

  function background(fx, fy) {
    const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, Math.hypot(W, H) * 0.7);
    g.addColorStop(0, '#5b2a6e'); g.addColorStop(0.35, '#2a1640'); g.addColorStop(1, '#07060c');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // god rays from the clash
    ctx.save(); ctx.translate(fx, fy); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * TAU + 0.1, w = 0.05 + rng() * 0.08;
      const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.hypot(W, H));
      gr.addColorStop(0, 'rgba(255,200,90,0.28)'); gr.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, Math.hypot(W, H), a, a + w); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // arena floor glow + perspective grid
    ctx.save();
    const fyF = H * 0.78;
    const fg = ctx.createLinearGradient(0, fyF - H * 0.1, 0, H);
    fg.addColorStop(0, 'rgba(255,140,60,0)'); fg.addColorStop(1, 'rgba(255,90,40,0.25)');
    ctx.fillStyle = fg; ctx.fillRect(0, fyF - H * 0.1, W, H);
    ctx.strokeStyle = 'rgba(255,170,90,0.18)'; ctx.lineWidth = Math.max(1, U * 0.002);
    for (let i = -14; i <= 14; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * W * 0.02, fyF); ctx.lineTo(W / 2 + i * W * 0.22, H); ctx.stroke(); }
    for (let k = 0; k < 6; k++) { const y = fyF + (H - fyF) * Math.pow(k / 6, 1.8); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.restore();
    // smoke
    for (let i = 0; i < 26; i++) {
      const x = rng() * W, y = H * (0.45 + rng() * 0.6), r = U * (0.08 + rng() * 0.18);
      const sg = ctx.createRadialGradient(x, y, 0, x, y, r);
      sg.addColorStop(0, 'rgba(180,140,200,0.10)'); sg.addColorStop(1, 'rgba(180,140,200,0)');
      ctx.fillStyle = sg; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    // bokeh embers
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 70; i++) {
      const x = rng() * W, y = rng() * H, r = U * (0.002 + rng() * 0.01);
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = rng() < 0.5 ? 'rgba(255,190,90,0.7)' : 'rgba(255,110,60,0.5)'; ctx.fill();
    }
    ctx.restore();
  }

  function streaks(x, y, ang, r, col) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 7; i++) {
      const o = (i - 3) * r * 0.3, l = r * (2.2 + rng() * 2.5);
      const g = ctx.createLinearGradient(-r, 0, -r - l, 0);
      g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(-r - l, o - r * 0.035, l, r * 0.07);
    }
    ctx.restore();
  }

  function ball(x, y, r, color, weapon, ang, opts) {
    opts = opts || {};
    if (opts.aim) ang = Math.atan2(opts.aim[1] - y, opts.aim[0] - x);
    const lw = r * 0.07;
    // ground shadow
    ctx.beginPath(); ctx.ellipse(x + r * 0.15, y + r * 1.08, r * 0.95, r * 0.22, 0, 0, TAU); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
    // weapon behind/in front
    if (weapon && BB.ITEM[weapon] && BB.ITEM[weapon].base.len) {
      const it = BB.ITEM[weapon], L = (opts.len || it.base.len * 1.6) * r / 34, Wd = it.base.width * 1.3 * r / 34;
      ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
      // swing blur
      ctx.globalAlpha = 0.25; ctx.save(); ctx.rotate(-0.35); BB.drawWeapon(ctx, weapon, r * 1.05, L, Wd, lw, 0.3, color); ctx.restore();
      ctx.globalAlpha = 0.45; ctx.save(); ctx.rotate(-0.17); BB.drawWeapon(ctx, weapon, r * 1.05, L, Wd, lw, 0.3, color); ctx.restore();
      ctx.globalAlpha = 1; BB.drawWeapon(ctx, weapon, r * 1.05, L, Wd, lw, 0.3, color);
      ctx.restore();
    }
    // body with rim light
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.05);
    g.addColorStop(0, BB.shade(color, 0.35)); g.addColorStop(0.55, color); g.addColorStop(1, BB.shade(color, -0.45));
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = g; ctx.fill();
    ctx.save(); ctx.clip();
    const rim = ctx.createRadialGradient(x - r * 0.9, y + r * 0.2, r * 0.6, x - r * 0.4, y, r * 1.4);
    rim.addColorStop(0, 'rgba(0,0,0,0)'); rim.addColorStop(0.8, 'rgba(0,0,0,0)'); rim.addColorStop(1, 'rgba(255,190,110,0.55)');
    ctx.fillStyle = rim; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.beginPath(); ctx.ellipse(x - r * 0.32, y - r * 0.45, r * 0.38, r * 0.2, -0.5, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.lineWidth = lw * 1.3; ctx.strokeStyle = OUT; ctx.stroke();
    // determined eyes
    const ex = Math.cos(ang) * r * 0.18;
    for (const s of [-1, 1]) {
      const px = x + ex + s * r * 0.25, py = y - r * 0.08;
      ctx.beginPath(); ctx.ellipse(px, py, r * 0.13, r * 0.17, 0, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = lw * 0.7; ctx.strokeStyle = OUT; ctx.stroke();
      ctx.beginPath(); ctx.arc(px + Math.cos(ang) * r * 0.05, py + Math.sin(ang) * r * 0.04, r * 0.075, 0, TAU); ctx.fillStyle = OUT; ctx.fill();
      ctx.beginPath(); ctx.moveTo(px - r * 0.17, py - r * (s < 0 ? 0.31 : 0.19)); ctx.lineTo(px + r * 0.17, py - r * (s < 0 ? 0.19 : 0.31));
      ctx.lineWidth = lw * 1.2; ctx.lineCap = 'round'; ctx.stroke(); ctx.lineCap = 'butt';
    }
  }

  function clash(x, y, s) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(x, y, 0, x, y, s * 2.4);
    g.addColorStop(0, 'rgba(255,255,230,1)'); g.addColorStop(0.2, 'rgba(255,210,90,0.8)'); g.addColorStop(1, 'rgba(255,90,30,0)');
    ctx.fillStyle = g; ctx.fillRect(x - s * 2.4, y - s * 2.4, s * 4.8, s * 4.8);
    ctx.restore();
    ctx.beginPath();
    for (let i = 0; i < 28; i++) { const a = (i * Math.PI) / 14 + 0.2, rr = i % 2 ? s * 0.3 : s * (0.8 + rng() * 0.6); ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.closePath(); ctx.fillStyle = '#fffbe8'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, s * 1.5, 0, TAU); ctx.lineWidth = s * 0.06; ctx.strokeStyle = 'rgba(255,220,120,0.7)'; ctx.stroke();
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 40; i++) {
      const a = rng() * TAU, d = s * (0.6 + rng() * 2.4), l = s * (0.1 + rng() * 0.35);
      ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * d, y + Math.sin(a) * d); ctx.lineTo(x + Math.cos(a) * (d + l), y + Math.sin(a) * (d + l));
      ctx.strokeStyle = rng() < 0.5 ? '#ffd23f' : '#ffffff'; ctx.lineWidth = s * 0.03; ctx.lineCap = 'round'; ctx.stroke();
    }
    ctx.restore();
  }

  function title(cx, cy, size) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.045);
    ctx.font = size + 'px Anton'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    const lines = ['BALL', 'BATTLES'], lh = size * 0.9;
    lines.forEach((t, i) => {
      const y = (i - 0.5) * lh;
      ctx.save(); ctx.shadowColor = 'rgba(255,170,60,0.85)'; ctx.shadowBlur = size * 0.35;
      ctx.lineWidth = size * 0.2; ctx.strokeStyle = OUT; ctx.strokeText(t, 0, y + size * 0.07); ctx.restore();
      ctx.lineWidth = size * 0.2; ctx.strokeStyle = OUT; ctx.strokeText(t, 0, y);
      ctx.lineWidth = size * 0.08; ctx.strokeStyle = i ? '#8a4b00' : '#55606e'; ctx.strokeText(t, 0, y);
      const g = ctx.createLinearGradient(0, y - size * 0.42, 0, y + size * 0.42);
      if (i === 0) { g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#dfe7f0'); g.addColorStop(0.52, '#aab8c6'); g.addColorStop(1, '#eef4fa'); }
      else { g.addColorStop(0, '#fff3a0'); g.addColorStop(0.48, '#ffc21a'); g.addColorStop(0.52, '#e08a00'); g.addColorStop(1, '#ffd34d'); }
      ctx.fillStyle = g; ctx.fillText(t, 0, y);
    });
    ctx.restore();
  }

  function draw() {
    const land = W / H > 1.3, port = H / W > 1.2;
    if (land) {
      const cx = W * 0.5, cy = H * 0.64, r = H * 0.17;
      background(cx, cy);
      streaks(W * 0.25, cy + r * 0.1, -0.12, r, 'rgba(255,170,90,0.5)');
      streaks(W * 0.75, cy + r * 0.1, Math.PI + 0.12, r, 'rgba(255,120,120,0.5)');
      ball(W * 0.9, H * 0.25, r * 0.45, '#2c5aa0', 'claymore', Math.PI * 0.85);
      ball(W * 0.1, H * 0.24, r * 0.45, '#d35400', 'firestaff', -0.25);
      clash(cx, cy - r * 0.05, r * 0.55);
      ball(W * 0.25, cy + r * 0.1, r, '#9aa0a6', 'rapier', -0.12, { len: 120 });
      ball(W * 0.75, cy + r * 0.1, r, '#e8473f', 'sword', Math.PI + 0.12, { len: 112 });
      ball(W * 0.09, H * 0.86, r * 0.5, '#ff7f11', null, -0.2);
      ball(W * 0.91, H * 0.85, r * 0.5, '#1abc9c', 'trident', Math.PI + 0.6);
      title(cx, H * 0.25, H * 0.19);
    } else if (port) {
      const cx = W * 0.5, cy = H * 0.6, r = W * 0.2;
      background(cx, cy);
      streaks(W * 0.24, H * 0.52, -0.5, r, 'rgba(255,170,90,0.5)');
      streaks(W * 0.76, H * 0.7, Math.PI - 0.5, r, 'rgba(255,120,120,0.5)');
      clash(cx, cy, r * 0.55);
      ball(W * 0.25, H * 0.47, r * 0.92, '#9aa0a6', 'rapier', 0, { len: 76, aim: [cx, cy] });
      ball(W * 0.76, H * 0.75, r * 0.92, '#e8473f', 'sword', 0, { len: 74, aim: [cx, cy] });
      ball(W * 0.18, H * 0.87, r * 0.5, '#2c5aa0', 'claymore', -0.4);
      ball(W * 0.86, H * 0.42, r * 0.45, '#d35400', 'firestaff', Math.PI + 0.3);
      title(cx, H * 0.2, W * 0.22);
    } else {
      const cx = W * 0.5, cy = H * 0.66, r = W * 0.15;
      background(cx, cy);
      streaks(W * 0.24, cy + r * 0.1, -0.15, r, 'rgba(255,170,90,0.5)');
      streaks(W * 0.76, cy + r * 0.1, Math.PI + 0.15, r, 'rgba(255,120,120,0.5)');
      clash(cx, cy - r * 0.05, r * 0.55);
      ball(W * 0.24, cy + r * 0.1, r, '#9aa0a6', 'rapier', 0, { len: 100, aim: [cx, cy - r * 0.05] });
      ball(W * 0.76, cy + r * 0.1, r, '#e8473f', 'sword', 0, { len: 94, aim: [cx, cy - r * 0.05] });
      title(cx, H * 0.25, W * 0.16);
    }
    // cinematic vignette + film grain
    const vg = ctx.createRadialGradient(W / 2, H / 2, U * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.62);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    const img = ctx.getImageData(0, 0, W, H), d = img.data, gr = BB.RNG(5);
    for (let i = 0; i < d.length; i += 4) { const n = (gr() - 0.5) * 10; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    ctx.putImageData(img, 0, 0);
    window.ARTDONE = true;
  }
  Promise.all([document.fonts.load('80px Anton'), document.fonts.load('20px "Lilita One"')]).then(draw, draw);
})();
</script>
</body>
</html>
