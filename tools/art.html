<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ball Battles cover art</title>
<style>
  @font-face { font-family: 'Lilita One'; src: url('../fonts/lilita-one.woff2') format('woff2'); }
  html, body { margin: 0; background: #222; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../js/core.js"></script>
<script src="../js/data.js"></script>
<script src="../js/render.js"></script>
<script>
// Renders the store covers. Usage: art.html?w=1920&h=1080
// Only the game title appears as text (CrazyGames cover rules).
(function () {
  const q = new URLSearchParams(location.search);
  const W = +q.get('w') || 1920, H = +q.get('h') || 1080;
  const cv = document.getElementById('c');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const TAU = Math.PI * 2, OUT = '#1d1d22';

  function rng(seed) { const r = BB.RNG(seed); return r; }

  function background() {
    const g = ctx.createRadialGradient(W / 2, H * 0.55, 0, W / 2, H * 0.55, Math.hypot(W, H) * 0.6);
    g.addColorStop(0, '#fff3c4');
    g.addColorStop(0.45, '#ffd060');
    g.addColorStop(1, '#ff8f3a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // sun rays
    ctx.save(); ctx.translate(W / 2, H * 0.55);
    const n = 22;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.arc(0, 0, Math.hypot(W, H), a, a + TAU / n / 2);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.13)'; ctx.fill();
    }
    ctx.restore();
    // soft floor arena hint: a white rounded board in perspective-free flat style
    const r = rng(11);
    for (let i = 0; i < 26; i++) {
      const x = r() * W, y = r() * H, rr = (6 + r() * 16) * (W / 1920 + H / 1080) / 2;
      ctx.beginPath(); ctx.arc(x, y, rr, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fill();
    }
  }

  function speedLines(x, y, ang, len, r, n, color) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const o = (i - (n - 1) / 2) * r * 0.45;
      const l = len * (0.55 + 0.45 * Math.cos(i * 1.7));
      ctx.beginPath(); ctx.moveTo(-r * 1.1, o); ctx.lineTo(-r * 1.1 - l, o);
      ctx.strokeStyle = color; ctx.lineWidth = r * 0.12; ctx.stroke();
    }
    ctx.restore();
  }

  function ball(x, y, r, team, weapon, ang, opts) {
    opts = opts || {};
    const tm = BB.TEAMS[team];
    const lw = r * 0.085;
    const it = BB.ITEM[weapon];
    if (weapon === 'spiky') {
      ctx.beginPath();
      const n = 12;
      for (let i = 0; i < n; i++) {
        const a = i * TAU / n + 0.2, a1 = a - Math.PI / n * 0.7, a2 = a + Math.PI / n * 0.7;
        ctx.moveTo(x + Math.cos(a1) * r * 0.92, y + Math.sin(a1) * r * 0.92);
        ctx.lineTo(x + Math.cos(a) * r * 1.42, y + Math.sin(a) * r * 1.42);
        ctx.lineTo(x + Math.cos(a2) * r * 0.92, y + Math.sin(a2) * r * 0.92);
      }
      ctx.fillStyle = '#d4dbe1'; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.stroke();
    }
    // drop shadow
    ctx.beginPath(); ctx.arc(x + r * 0.08, y + r * 0.14, r, 0, TAU); ctx.fillStyle = 'rgba(80,30,0,0.25)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = tm.fill; ctx.fill();
    ctx.lineWidth = lw * 1.3; ctx.strokeStyle = OUT; ctx.stroke();
    // shading
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r - lw * 0.6, 0, TAU); ctx.clip();
    ctx.beginPath(); ctx.arc(x + r * 0.35, y + r * 0.45, r * 0.95, 0, TAU); ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.ellipse(x - r * 0.35, y - r * 0.4, r * 0.26, r * 0.17, -0.6, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
    // little determined eyes give the balls character on the cover
    if (opts.eyes !== false) {
      const ex = Math.cos(ang) * r * 0.22, ey = Math.sin(ang) * r * 0.22;
      for (const s of [-1, 1]) {
        const px = x + ex + s * r * 0.24 * Math.cos(ang + Math.PI / 2) * 0.0 + s * r * 0.24, py = y + ey - r * 0.05;
        ctx.beginPath(); ctx.ellipse(px, py, r * 0.13, r * 0.18, 0, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill();
        ctx.lineWidth = lw * 0.7; ctx.strokeStyle = OUT; ctx.stroke();
        ctx.beginPath(); ctx.arc(px + Math.cos(ang) * r * 0.05, py + Math.sin(ang) * r * 0.06, r * 0.075, 0, TAU); ctx.fillStyle = OUT; ctx.fill();
        // brow
        ctx.beginPath(); ctx.moveTo(px - r * 0.16, py - r * (s < 0 ? 0.33 : 0.2)); ctx.lineTo(px + r * 0.16, py - r * (s < 0 ? 0.2 : 0.33));
        ctx.lineWidth = lw * 1.1; ctx.lineCap = 'round'; ctx.stroke(); ctx.lineCap = 'butt';
      }
    }
    if (weapon === 'fibonacci') {
      // golden spiral emblem on the belly
      ctx.save(); ctx.translate(x - r * 0.05, y + r * 0.42); ctx.scale(0.55, 0.55);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = r * 0.12; ctx.lineCap = 'round';
      ctx.beginPath();
      let cx = 0, cy = 0, a = 0; const s = r * 0.05, seq = [1, 1, 2, 3, 5, 8];
      for (let i = 0; i < seq.length; i++) { const rr = seq[i] * s; ctx.arc(cx, cy, rr, a, a + Math.PI / 2); const ea = a + Math.PI / 2, nr = (seq[i + 1] || 0) * s; cx += Math.cos(ea) * (rr - nr); cy += Math.sin(ea) * (rr - nr); a = ea; }
      ctx.stroke(); ctx.restore();
    }
    if (it && it.cat === 'weapon' && it.base.len) {
      const L = (opts.len || it.base.len * 1.55) * r / 34, Wd = it.base.width * 1.25 * r / 34;
      ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
      BB.drawWeapon(ctx, weapon, r + r * 0.06, L, Wd, lw, 0.4, tm.fill);
      ctx.restore();
    }
  }

  function spark(x, y, s) {
    ctx.save(); ctx.translate(x, y);
    const pts = 10;
    ctx.beginPath();
    for (let i = 0; i < pts * 2; i++) { const a = (i * Math.PI) / pts + 0.15, rr = i % 2 ? s * 0.38 : s * (0.8 + 0.2 * Math.cos(i * 2.3)); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = s * 0.05; ctx.strokeStyle = OUT; ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < pts * 2; i++) { const a = (i * Math.PI) / pts + 0.15, rr = i % 2 ? s * 0.22 : s * 0.5; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fillStyle = '#ffe14d'; ctx.fill();
    ctx.restore();
    const r = rng(Math.round(x + y));
    for (let i = 0; i < 14; i++) {
      const a = r() * TAU, d = s * (0.9 + r() * 0.9), rr = s * (0.03 + r() * 0.05);
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, rr, 0, TAU);
      ctx.fillStyle = i % 2 ? '#ffffff' : '#ffe14d'; ctx.fill();
    }
  }

  function arrow(x, y, ang, s) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
    ctx.lineWidth = 1.6; ctx.strokeStyle = OUT;
    ctx.beginPath(); ctx.rect(-26, -1.8, 28, 3.6); ctx.fillStyle = '#6e3d1c'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2, -5.5); ctx.lineTo(14, 0); ctx.lineTo(2, 5.5); ctx.closePath(); ctx.fillStyle = '#eef2f6'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-26, -6); ctx.lineTo(-18, 0); ctx.lineTo(-26, 6); ctx.lineTo(-21, 0); ctx.closePath(); ctx.fillStyle = BB.TEAMS[2].fill; ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function title(cx, cy, size, tilt) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(tilt || 0);
    ctx.font = size + 'px "Lilita One"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    const lines = ['BALL', 'BATTLES'];
    const lh = size * 0.92;
    lines.forEach((t, i) => {
      const y = (i - 0.5) * lh;
      ctx.lineWidth = size * 0.2; ctx.strokeStyle = OUT;
      ctx.strokeText(t, size * 0.03, y + size * 0.09);
      ctx.strokeText(t, 0, y);
      const g = ctx.createLinearGradient(0, y - size * 0.4, 0, y + size * 0.4);
      if (i === 0) { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#d9f3ff'); }
      else { g.addColorStop(0, '#ffe766'); g.addColorStop(1, '#ffb21e'); }
      ctx.fillStyle = g; ctx.fillText(t, 0, y);
      ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.rect(-W, y - size * 0.42, W * 2, size * 0.18); ctx.clip(); ctx.fillText(t, 0, y); ctx.restore();
    });
    ctx.restore();
  }

  function draw() {
    background();
    const land = W / H > 1.3, port = H / W > 1.2;
    const u = Math.min(W, H);
    if (land) {
      // hero clash under the title
      const r = H * 0.16;
      speedLines(W * 0.28, H * 0.7, -0.15, r * 1.6, r, 5, 'rgba(255,255,255,0.75)');
      speedLines(W * 0.72, H * 0.7, Math.PI + 0.15, r * 1.6, r, 5, 'rgba(255,255,255,0.75)');
      ball(W * 0.72, H * 0.7, r, 1, 'axe', Math.PI + 0.3, { len: 74 });
      ball(W * 0.28, H * 0.7, r, 0, 'sword', -0.24, { len: 86 });
      spark(W * 0.5, H * 0.6, r * 0.72);
      ball(W * 0.09, H * 0.28, r * 0.5, 2, 'bow', -0.3);
      arrow(W * 0.2, H * 0.25, -0.15, H / 900);
      arrow(W * 0.24, H * 0.31, 0.02, H / 900);
      ball(W * 0.9, H * 0.86, r * 0.48, 3, 'spiky', Math.PI + 0.8);
      ball(W * 0.1, H * 0.86, r * 0.42, 0, 'fibonacci', -0.3, { eyes: true });
      ball(W * 0.91, H * 0.22, r * 0.42, 1, 'dagger', Math.PI * 0.8);
      title(W * 0.5, H * 0.26, H * 0.2, -0.04);
    } else if (port) {
      const r = W * 0.19;
      speedLines(W * 0.3, H * 0.52, -0.6, r * 1.3, r, 5, 'rgba(255,255,255,0.75)');
      speedLines(W * 0.7, H * 0.76, Math.PI - 0.6, r * 1.3, r, 5, 'rgba(255,255,255,0.75)');
      ball(W * 0.28, H * 0.52, r, 0, 'sword', 0.15, { len: 88 });
      ball(W * 0.72, H * 0.78, r, 1, 'axe', -Math.PI * 0.62, { len: 80 });
      spark(W * 0.6, H * 0.6, r * 0.7);
      ball(W * 0.18, H * 0.86, r * 0.5, 2, 'bow', -0.5);
      arrow(W * 0.36, H * 0.8, -0.5, W / 600);
      ball(W * 0.85, H * 0.42, r * 0.45, 3, 'spiky', Math.PI);
      title(W * 0.5, H * 0.2, W * 0.24, -0.04);
    } else {
      const r = W * 0.15;
      speedLines(W * 0.27, H * 0.7, -0.3, r * 1.3, r, 5, 'rgba(255,255,255,0.75)');
      speedLines(W * 0.73, H * 0.7, Math.PI + 0.3, r * 1.3, r, 5, 'rgba(255,255,255,0.75)');
      ball(W * 0.25, H * 0.7, r, 0, 'sword', -0.5, { len: 84 });
      ball(W * 0.75, H * 0.7, r, 1, 'axe', Math.PI + 0.6, { len: 76 });
      spark(W * 0.5, H * 0.53, r * 0.7);
      ball(W * 0.1, H * 0.1 + r * 0.2, r * 0.42, 2, 'bow', 0.2);
      ball(W * 0.9, H * 0.92, r * 0.4, 3, 'spiky', Math.PI);
      title(W * 0.5, H * 0.27, W * 0.17, -0.04);
    }
    void u;
    window.ARTDONE = true;
  }

  document.fonts.load('80px "Lilita One"').then(draw, draw);
})();
</script>
</body>
</html>
