<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Ball Vs Ball</title>
  <meta name="description" content="Pick a weapon, drop two balls in the arena and watch them battle it out.">
  <link rel="preload" href="fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/pixelify.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>
<body>
  <div id="loader" class="loader lx" aria-label="Loading">
 <div class="lx-cam">
    <div class="lx-bg"></div><div class="lx-speed"></div><div class="lx-grid"></div><div class="lx-embers"></div><div class="lx-vig"></div>
    <div class="lx-stage">
      <div class="lx-ball l g2"><div class="lx-spin"><b></b></div></div><div class="lx-ball r g2"><div class="lx-spin"><b></b></div></div>
      <div class="lx-ball l g1"><div class="lx-spin"><b></b></div></div><div class="lx-ball r g1"><div class="lx-spin"><b></b></div></div>
      <div class="lx-ball l"><div class="lx-spin"><b></b></div></div>
      <div class="lx-ball r"><div class="lx-spin"><b></b></div></div>
      <div class="lx-spark c1"></div><div class="lx-spark c2"></div><div class="lx-spark c3"></div>
      <div class="lx-ring c1"></div><div class="lx-ring c2"></div><div class="lx-ring c3"></div><div class="lx-ring c3 two"></div>
      <div class="lx-flash c1"></div><div class="lx-flash c2"></div><div class="lx-flash c3"></div>
    </div>
 </div>
    <div class="lx-impact"></div><div class="lx-bars"></div>
    <div class="lx-title"><span class="w">BALL</span><span class="vs">VS</span><span class="y">BALL</span></div>
    <div class="lx-load">
      <div class="lx-row"><span><em id="ldStep">1/5</em> <span id="ldTip">Contacting the arena...</span></span><b id="ldPct">0%</b></div>
      <div class="lx-bar" id="ldBar"><i><u></u></i><i><u></u></i><i><u></u></i><i><u></u></i><i><u></u></i></div>
    </div>
  </div>
  <div id="app" class="is-menu">
    <header id="topbar">
      <div class="coins" id="coins" title="Coins"><span class="coin-ic"></span><span id="coinCount">0</span></div>
      <div class="brand"></div>
      <button class="icon-btn pass-btn" id="btnPass" aria-label="Season Pass"><span class="pb-hex"><b>0</b></span><span class="bp-hot"></span></button>
      <button class="icon-btn gift-btn" id="btnGift" aria-label="Rewards"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 7h-2.2A3 3 0 0 0 12 4.4 3 3 0 0 0 6.2 7H4a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8h1a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1zm-5-1a1 1 0 1 1 0 2h-2a1 1 0 0 1 2-2zM9 6a1 1 0 0 1 1 1v1H9a1 1 0 0 1 0-2zm2 14H7v-8h4zm0-10H5V9h6zm6 10h-4v-8h4zm2-10h-6V9h6z"/></svg><span class="dot-badge"></span></button>
      <button class="icon-btn hidden" id="btnProfile" aria-label="Profile"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg></button>
      <button class="icon-btn" id="btnSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
    </header>

    <main id="stage">
      <section id="arenaCol">
        <div id="matchup" class="matchup"></div>
        <div id="arenaWrap">
          <canvas id="arena"></canvas>
          <button class="icon-btn pause-btn" id="btnPause" aria-label="Pause">
            <svg viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
          </button>
          <button class="speed-btn" id="btnSpeed" aria-label="Battle speed">1x</button>
          <div id="banner" class="banner"></div>
        </div>
        <div id="statRow" class="stat-row"></div>
      </section>

      <section id="panel">
        <div id="menuPanel">
          <div id="slots" class="slots"></div>
          <div class="opts">
            <button class="opt" id="optMode"><span class="opt-k">Mode</span><span class="opt-v" id="optModeV">1 vs 1</span></button>
            <button class="opt" id="optMap"><span class="opt-k">Map</span><span class="opt-v" id="optMapV">Classic</span></button>
            <button class="opt" id="optControl"><span class="opt-k">Control</span><span class="opt-v" id="optControlV">Off</span></button>
            <button class="opt opt-pvp hidden" id="optPvp"><span class="opt-k">Online</span><span class="opt-v">PvP</span></button>
            <button class="opt opt-dice" id="optRandom" aria-label="Random opponents"><span class="opt-k">Random</span><span class="opt-v">Foes</span></button>
          </div>
          <button class="big-btn" id="btnStart">Start Battle</button>
          <div class="feat-row">
            <button class="feat" id="btnCup"><span class="feat-ic" data-ico="trophy"></span><span>Cup</span></button>
            <button class="feat" id="btnGauntlet"><span class="feat-ic" data-ico="swords"></span><span>Gauntlet</span></button>
            <button class="feat" id="btnQuests"><span class="feat-ic" data-ico="scroll"></span><span>Quests</span><span class="dot-badge"></span></button>
          </div>
        </div>
        <div id="battlePanel">
          <div id="joystick" class="joystick" aria-label="Joystick"><div class="knob"></div></div>
          <div id="controlHint" class="hint">Drag the stick or use WASD / arrow keys to steer your ball</div>
        </div>
      </section>
    </main>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="sheet" id="sheet"></div>
    </div>
    <div id="toast" class="toast"></div>
  </div>

  <script defer src="js/core.js"></script>
  <script defer src="js/icons.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/data2.js"></script>
  <script defer src="js/abilities.js"></script>
  <script defer src="js/balance.js"></script>
  <script defer src="js/sim.js"></script>
  <script defer src="js/render.js"></script>
  <script defer src="js/art.js"></script>
  <script defer src="js/art2.js"></script>
  <script defer src="js/kami.js"></script>
  <script defer src="js/data3.js"></script>
  <script defer src="js/data4.js"></script>
  <script defer src="js/data5.js"></script>
  <script defer src="js/flair.js"></script>
  <script defer src="js/audio.js"></script>
  <script defer src="js/sdk.js"></script>
  <script defer src="js/save.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/meta.js"></script>
  <script defer src="js/season.js"></script>
  <script defer src="js/match.js"></script>
  <script defer src="js/party.js"></script>
  <script defer src="js/shoot.js"></script>
  <script defer src="js/pvptut.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
